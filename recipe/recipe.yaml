schema_version: 1

context:
  name: azure-mgmt-iothub
  version: 3.0.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/azure-mgmt-iothub-${{ version }}.tar.gz
  sha256: daf21fc98c68a353ec616318c0e62be04c8d6899960be8c2cbf991673ac8b722

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - setuptools
    - python ${{ python_min }}.*
    - pip
  run:
    - python >=${{ python_min }}
    - azure-common >=1.1,<2.0
    - azure-mgmt-core >=1.3.2,<2.0
    - isodate >=0.6.1,<1.0

tests:
  - python:
      imports:
        - azure.mgmt.iothub
        - azure.mgmt.iothub.aio
      pip_check: true
      python_version: ${{ python_min }}.*
about:
  summary: Microsoft Azure IoT Hub Management Client Library for Python
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Azure/azure-sdk-for-python

extra:
  recipe-maintainers:
    - janjagusch
