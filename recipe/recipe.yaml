schema_version: 1

context:
  name: azure-mgmt-iothub
  version: "5.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/azure_mgmt_iothub-${{ version }}.tar.gz
  sha256: 58f2c24938c195b32c05a29a38ac3ae161f4d4b7ba688e0f77525fa285ca25db

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - setuptools
    - python ${{ python_min }}.*
    - pip
  run:
    - python >=${{ python_min }}
    - isodate >=0.6.1
    - typing_extensions >=4.6.0
    - azure-common >=1.1
    - azure-mgmt-core >=1.3.2

tests:
  - python:
      imports:
        - azure.mgmt.iothub
        - azure.mgmt.iothub.aio
      pip_check: true
      python_version: ${{ python_min }}.*
about:
  summary: Microsoft Azure IoT Hub Management Client Library for Python
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Azure/azure-sdk-for-python

extra:
  recipe-maintainers:
    - janjagusch
